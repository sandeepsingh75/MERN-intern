<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express form validation</title>
</head>
<body>
    <h1>Express form validation with express-validator</h1>

    <form method="post" action="http://localhost:5000/users/create">
        <input type="text" placeholder="Enter your name" name="name"><br><br>
        <input type="email" placeholder="Enter your email" name="email"><br><br>
        <input type="number" placeholder="Enter your age" name="age"><br><br>
        <input type="submit" value="submit">
    </form>
</body>
</html>
