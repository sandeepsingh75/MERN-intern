<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
</head>
<body>
    <form action="http://localhost:5000/register" method="POST">

        <input 
            type="text" 
            name="name" 
            placeholder="Enter name"
        >
        <br><br>

        <input 
            type="email" 
            name="email" 
            placeholder="Enter email"
        >
        <br><br>
        <input 
            type="password" 
            name="password" 
            placeholder="Enter password"
        >
        <br><br>
        <button type="submit">Register</button>

    </form>

</body>
</html>
